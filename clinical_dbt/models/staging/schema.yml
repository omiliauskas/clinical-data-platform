version: 2

models:
  - name: stg_trials_heart_disease
    columns:
      - name: nct_id
        tests:
          - unique
          - not_null
      - name: overall_status
        tests:
          - not_null
  - name: stg_trials_diabetes
    columns:
      - name: nct_id
        tests:
          - unique
          - not_null
      - name: overall_status
        tests:
          - not_null 
  - name: stg_adverse_events_heart_disease
    columns:
      - name: safety_report_id
        tests:
          - unique
          - not_null
      - name: is_serious
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: is_death
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: is_hospitalization
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false