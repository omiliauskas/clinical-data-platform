version: 2

models:
  - name: fct_trials_summary
    columns:
      - name: condition
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:  
                  - heart_disease
                  - diabetes
      - name: trials_count
        tests:
          - not_null
  - name: dim_condition
    columns:
      - name: condition_key
        tests:
          - unique
          - not_null
  - name: dim_status
    columns:
      - name: overall_status_key
        tests:
          - unique
          - not_null
  - name: dim_study_type
    columns:
      - name: study_type_key
        tests:
          - unique
          - not_null
  - name: fct_trials
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - nct_id
              - condition_key
    columns:
      - name: nct_id
        tests:
          - not_null
  - name: dim_report_type
    columns:
      - name: report_type_key
        tests:
          - unique
          - not_null
  - name: dim_country
    columns:
      - name: country_key
        tests:
          - unique
          - not_null
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
  - name: fct_adverse_events
    columns:
      - name: safety_report_id
        tests:
          - unique
          - not_null
      - name: primary_source_country_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key
      - name: occur_country_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: report_type_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_report_type')
                field: report_type_key