name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write placeholder dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          clinical_dbt:
            target: ci
            outputs:
              ci:
                type: athena
                s3_staging_dir: s3://placeholder/staging/
                region_name: eu-west-1
                database: awsdatacatalog
                schema: ci
          EOF

      - name: Install dbt packages
        working-directory: clinical_dbt
        run: dbt deps

      - name: Validate dbt project
        working-directory: clinical_dbt
        run: dbt parse